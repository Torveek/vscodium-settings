  \\\"password\\toptional\\tpam_gnome_keyring.so\\\" | sudo tee -a
  /etc/pam.d/passwd >/dev/null\\r\\nfi\\r\\n\\r\\nlog_success \\\"gnome-keyring
  PAM configured\\\"\\r\\n\\r\\n# Configure pacman.conf\\r\\nlog_info
  \\\"Configuring
  pacman.conf...\\\"\\r\\nPACMAN_CONF=\\\"/etc/pacman.conf\\\"\\r\\n\\r\\n[ -f
