  other tools and applications I use daily.\\r\\n\\r\\n##
  Overview\\r\\n\\r\\nThis is a collection of configuration files (dotfiles)
  that I use for my personal computing environment. The configurations are
  tailored for the Niri window manager and include settings for various
  applications and tools.\\r\\n\\r\\n## Contents\\r\\n\\r\\nThe repository
  includes configurations for:\\r\\n\\r\\n- **Niri**: Window manager
  configuration\\r\\n- **Alacritty**: Terminal emulator settings\\r\\n-
  **Btop**: System monitor configuration\\r\\n- **Fastfetch**: System
  information tool\\r\\n- **Fuzzel**: Application launcher\\r\\n- **GTK**: Theme
  settings for GTK applications\\r\\n- **Noctalia**: Quickshell as top bar and
  etc\\r\\n- **Starship**: Prompt customization\\r\\n- **Neovim**: Editor
  configuration\\r\\n- **Zsh**: Shell configuration\\r\\n- And
  more...\\r\\n\\r\\n## Installation\\r\\n\\r\\nTo use these configurations, you
  can run the setup script directly from GitHub:\\r\\n\\r\\n```bash\\r\\ncurl
  -fsSL https://raw.githubusercontent.com/Torveek/niri-dotfiles/main/setup.sh |
  bash\\r\\n```\\r\\n\\r\\nAlternatively, you can clone the repository and run
  the setup
  script:\\r\\n\\r\\n```bash\\r\\n./setup.sh\\r\\n```\\r\\n\\r\\nAdditional
  installation scripts are available in the `install/` directory for specific
  components.\\r\\n\\r\\n## License\\r\\n\\r\\nThis project is licensed under
  the terms found in the [LICENSE](LICENSE)
  file.\\r\\n\"},\"summaryData\":{\"isFull\":true,\"workspacePath\":\"c:\\\\Use\
