  configured:\\\"\\r\\n  log_detail
  \\\"  Name:  $CURRENT_GIT_NAME\\\"\\r\\n  log_detail \\\"  Email:
  $CURRENT_GIT_EMAIL\\\"\\r\\n\\r\\n  if ask_yes_no \\\"Update git config?\\\";
