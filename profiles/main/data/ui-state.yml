  \\\"Configuring gnome-keyring PAM integration...\\\"\\r\\n\\r\\n[ -f
  \\\"/etc/pam.d/login\\\" ] && backup_file \\\"/etc/pam.d/login\\\"\\r\\n[ -f
  \\\"/etc/pam.d/passwd\\\" ] && backup_file
  \\\"/etc/pam.d/passwd\\\"\\r\\n\\r\\n# Configure /etc/pam.d/login\\r\\nif !
